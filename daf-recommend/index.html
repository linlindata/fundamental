<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D+AF 智慧選鞋</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#30282b;background:#fcf8f7}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px 20px;border-bottom:1px solid #f1e8e9;position:sticky;top:0}small{letter-spacing:.17em;color:#ac798a}h1{font-size:24px;margin:6px 0}main{padding:20px;max-width:700px;margin:auto}.hero{background:linear-gradient(135deg,#f4dce3,#fdf3ed);padding:28px 22px;border-radius:22px;margin-bottom:20px}.hero h2{font-size:29px;line-height:1.3;margin:8px 0}.hero p{line-height:1.7}input,select,button{font:inherit;border-radius:12px;padding:14px;border:1px solid #e9dce0}input{width:100%;background:#fff}button,.action{background:#30282b;color:#fff;border:0;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}.action{padding:14px;border-radius:12px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chips button{background:#fff;color:#59444c;border:1px solid #e9dce0;padding:10px 13px}.panel{background:#fff;border:1px solid #eee2e6;border-radius:18px;padding:20px;margin:16px 0}p{line-height:1.65}#results a{display:block;padding:12px;margin:8px 0;background:#faf3f5;border-radius:10px;color:#30282b}footer{font-size:12px;color:#8e8084;padding:20px}</style></head><body><header><small>D+AF · SHOE FINDER</small><h1>智慧選鞋顧問</h1></header><main><section class="hero"><small>FIND YOUR PERFECT PAIR</small><h2>從日常到重要時刻，<br>找到妳喜歡的鞋。</h2><p>依照場合與需求快速前往 D+AF 官方商品目錄。</p><a class="action" href="https://www.daf-shoes.com/product/list/all" target="_blank" rel="noopener">瀏覽 D+AF 官網全系列 ↗</a></section><section class="panel"><h3>想找什麼樣的鞋？</h3><input id="q" placeholder="例如：通勤、瑪莉珍、樂福鞋、低跟"><div class="chips"><button data-q="通勤">上班通勤</button><button data-q="瑪莉珍">瑪莉珍</button><button data-q="樂福鞋">樂福鞋</button><button data-q="平底鞋">平底鞋</button><button data-q="靴">靴子</button></div><button id="go">尋找商品</button><div id="results" aria-live="polite"></div></section><section class="panel"><h3>商品同步狀態</h3><p>目前尚未匯入及核實 D+AF 全站商品資料，因此本頁不會捏造商品圖片、價格或庫存。可先使用上方入口瀏覽官網實際商品。</p></section><footer>非 D+AF 官方網站。商品資訊及交易以 D+AF 官網為準。</footer></main><script>const q=document.getElementById('q'),out=document.getElementById('results');function go(){const v=q.value.trim();out.innerHTML='';const a=document.createElement('a');a.href='https://www.google.com/search?q='+encodeURIComponent('site:daf-shoes.com/product/ D+AF '+v);a.target='_blank';a.rel='noopener';a.textContent='搜尋官網相關商品：'+(v||'全系列')+' ↗';out.append(a)}document.getElementById('go').onclick=go;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;go()});q.addEventListener('keydown',e=>{if(e.key==='Enter')go()})</script></body></html>
