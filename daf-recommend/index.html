<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D+AF 人事時地物智慧選鞋</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f6;color:#30282b;font:15px system-ui,"Noto Sans TC",sans-serif}header{background:white;padding:18px 20px;position:sticky;top:0;border-bottom:1px solid #eee;z-index:1}header small{letter-spacing:.2em;color:#ae7c8c}h1{font-size:22px;margin:5px 0}main{max-width:600px;margin:auto;padding:18px}.hero{border-radius:22px;background:linear-gradient(135deg,#efd5df,#f9eee9);padding:24px}.hero h2{font-size:27px;margin:8px 0}.hero p{line-height:1.6}.panel{margin-top:16px;background:white;border-radius:18px;padding:18px;border:1px solid #f1e7ea}.step{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;margin:0 0 13px}.step span{background:#332a30;color:white;border-radius:10px;padding:6px 11px}.options{display:flex;flex-wrap:wrap;gap:9px}button{font:inherit;cursor:pointer;border:1px solid #e7d9de;background:white;color:#4b3a42;border-radius:30px;padding:10px 14px}button.active{background:#342a30;color:white;border-color:#342a30}.submit{width:100%;background:#342a30;color:white;border-radius:14px;padding:15px;margin-top:16px}#result{line-height:1.8}a{color:#6c4154}footer{color:#87777c;font-size:12px;line-height:1.6;margin:20px 0}</style></head><body><header><small>D+AF · SMART SHOE FINDER</small><h1>人・事・時・地・物</h1></header><main><section class="hero"><small>找到適合妳的每一步</small><h2>五個角度，選出理想鞋款</h2><p>依照穿著者、場合、時間、地點與鞋款需求，自由多選。每一步都能略過。</p></section><div id="filters"></div><button class="submit" id="submit">查看我的選鞋建議 →</button><section class="panel" id="result" aria-live="polite"><strong>尚未開始篩選</strong><p>選擇上方條件，立即產生搜尋方向。</p></section><footer>本頁為功能測試版，尚未完成全站商品資料匯入；不會冒充官網商品、價格或庫存。商品及交易請以 D+AF 官網為準。</footer></main><script>const groups=[["人","誰要穿？",["自己","送禮","上班族","學生","長時間站立"]],["事","準備做什麼？",["通勤","約會","面試","婚禮","旅遊","逛街"]],["時","什麼時候穿？",["春夏","秋冬","雨天","全天穿著","正式場合"]],["地","會在哪裡穿？",["辦公室","校園","戶外","餐廳","旅行"]],["物","想要什麼鞋？",["樂福鞋","瑪莉珍","平底鞋","低跟鞋","休閒鞋","靴子","黑色","米白色","舒適"]]];const chosen={};const host=document.getElementById('filters');groups.forEach(([k,title,opts])=>{chosen[k]=new Set();const section=document.createElement('section');section.className='panel';section.innerHTML='<div class="step"><span>'+k+'</span>'+title+'</div>';const wrap=document.createElement('div');wrap.className='options';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(chosen[k].has(o)){chosen[k].delete(o);b.classList.remove('active')}else{chosen[k].add(o);b.classList.add('active')}};wrap.appendChild(b)});section.appendChild(wrap);host.appendChild(section)});document.getElementById('submit').onclick=()=>{const terms=Object.values(chosen).flatMap(s=>[...s]);const r=document.getElementById('result');r.replaceChildren();const h=document.createElement('h3');h.textContent='妳的選鞋條件';r.append(h);const p=document.createElement('p');p.textContent=terms.join('・')||'尚未選擇條件，先瀏覽全系列';r.append(p);const a=document.createElement('a');a.href=terms.length?'https://www.google.com/search?q='+encodeURIComponent('site:daf-shoes.com/product/ D+AF '+terms.join(' ')):'https://www.daf-shoes.com/product/list/all';a.target='_blank';a.rel='noopener';a.textContent='前往查看相關官網商品 ↗';r.append(a);const note=document.createElement('p');note.textContent='提示：目前是條件式官網搜尋，不是已核實商品庫的精準配對。';r.append(note);r.scrollIntoView({behavior:'smooth',block:'start'})}</script></body></html>
